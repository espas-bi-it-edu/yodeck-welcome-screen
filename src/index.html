<!DOCTYPE html>

<html>

<head>
  <meta charset="UTF-8">

  <title>ESPAS Welcome Screen</title>

  <!-- Yodeck Styles -->
  <link href="styles.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      /* Neutrale Farben */
      --white: #ffffff;
      --light-gray: #e6e6e6;
      --gray: #9da3a8;
      --dark-gray: #555b60;
      --black: #212529;

      /* Farben */
      --blue: #7dbfd4;
      --green: #9adaa9;
      --cyan: #6ed0df;
      --yellow: #f0e266;
      --red: #d17b78;

      --purple: #8171bb;
      --orange: #e0b068;
      --teal: #50a78d;
    }

    /* Hintergrundfarbe */
    .screen {
      background-color: var(--light-gray);
    }

    /* Kartenfarben */
    .card {
      background-color: var(--blue);
      color: var(--black);
    }

    /* Farbe des Namen */
    .name {
      color: var(--yellow);
    }
  </style>
</head>

<body>
  <div class="screen container">
    <!-- Linke Spalte -->
    <div class="column">

      <!-- Willkommen -->
      <div class="card welcome-card">
        <span class="icon bi-person-fill"></span>

        <h2>Herzlich Willkommen in der ESPAS</h2>

        <!-- Name des Schnupperer -->
        <h1 class="name">Vorname Nachname</h1>

        <p>Schön, dass Du heute als Schnupperer bei uns bist!</p>
      </div>
    </div>

    <!-- Rechte Spalte -->
    <div class="column">

      <!-- Götti -->
      <div class="card info-card">
        <span class="icon bi-person-heart"></span>

        <h2>Dein Götti</h2>

        <!-- Name und Funktion des Götti -->
        <ul>
          <li>Vorname Nachname</li>
          <li>Funktion</li>
        </ul>
      </div>

      <!-- Arbeitszeiten -->
      <div class="card info-card">
        <span class="icon bi-clock-fill"></span>

        <h2>Arbeitszeiten</h2>

        <ul>
          <li>Montag - Mittwoch</li>
          <li>08:00 - 15:00</li>
        </ul>
      </div>

      <!-- Pausen -->
      <div class="card info-card">
        <span class="icon bi-cup-hot-fill"></span>

        <h2>Pausen</h2>

        <ul>
          <li><strong>Morgen:</strong> 10:00 - 10:15</li>
          <li><strong>Mittag:</strong> 11:55 - 13:00</li>
        </ul>
      </div>
    </div>
  </div>
</body>

</html>
