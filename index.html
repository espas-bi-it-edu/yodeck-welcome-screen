<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>yodeck-welcome-screen - Liquid Glass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* =========================================
           VERFÜGBARE FARBEN & SCHRIFTFARBE GRÜN
           ========================================= */
        * {
            color: rgb(80, 252, 1) !important;
        }

        :root {
            --neon-green: rgb(80, 252, 1);
            --dark-green: rgba(80, 252, 1, 0.25);
        }

        /* =========================================
           HINTERGRUND & ANIMIERTES GRID SYSTEM
           ========================================= */
        body {
            background: #050508;
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animiertes Raster im Hintergrund */
        body::before {
            content: '';
            position: fixed;
            top: -40px;
            left: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            background-image: 
                linear-gradient(rgba(80, 252, 1, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(80, 252, 1, 0.15) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(80, 252, 1, 0.12) 0%, transparent 60%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            z-index: 1;
            pointer-events: none;
            animation: moveGrid 3s linear infinite;
        }

        @keyframes moveGrid {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(40px, 40px);
            }
        }

        /* =========================================
           LAYOUT GRID
           ========================================= */
        .screen {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 992px) {
            .screen {
                grid-template-columns: 1fr;
            }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* =========================================
           THE HEAVY REFRACTIVE LENS CARD
           ========================================= */
        .welcome-card {
            position: relative;
            padding: 30px;
            border-radius: 24px;
            box-sizing: border-box;
            background: transparent;
            border: 1px solid var(--dark-green);
            box-shadow: 
                inset 0 1px 0px rgba(80, 252, 1, 0.4),
                0 12px 32px rgba(0, 0, 0, 0.8);
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            z-index: -1;
            background: rgba(80, 252, 1, 0.02);
            -webkit-backdrop-filter: url(#apple-heavy-distortion) saturate(140%) brightness(105%);
            backdrop-filter: url(#apple-heavy-distortion) saturate(140%) brightness(105%);
        }

        .right-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            min-height: 450px;
        }

        /* =========================================
           CARD CONTENT STYLING
           ========================================= */
        .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .name {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 0 12px rgba(80, 252, 1, 0.5);
        }

        .subtitle {
            font-size: 16px;
            line-height: 1.5;
        }

        .subtitle ul {
            padding-left: 20px;
            margin: 5px 0 0 0;
        }
    </style>
</head>

<body>

    <div class="container-fluid screen fade-in">

        <!-- LINKE SEITE -->
        <div class="left-column">

            <!-- Box 1 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-person-heart"></i>
                </div>
                <h1>Götti</h1>
                <div class="subtitle">
                    Simon Meier
                    <br>
                    Tagesverantwortliche Fachperson
                </div>
            </div>

            <!-- Box 2 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-calendar3"></i>
                </div>
                <h1>Arbeitstage</h1>
                <div class="subtitle">
                    Mo. bis Mi.
                </div>
            </div>

            <!-- Box 3 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-clock"></i>
                </div>
                <h1>Arbeitszeit</h1>
                <div class="subtitle">
                    08.00 - 15.00
                </div>
            </div>

            <!-- Box 4 -->
            <div class="welcome-card">
                <div class="icon">
                    <i class="bi bi-cup-hot"></i>
                </div>
                <h1>Pausen</h1>
                <div class="subtitle">
                    <ul>
                        <li>Morgen: 10.00 - 10.15</li>
                        <li>Mittag: 11.55 - 13.00</li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- RECHTE WELCOME BOX -->
        <div class="welcome-card right-box">
            <div class="icon">
                <i class="bi bi-person"></i>
            </div>
            <h1>Herzlich Willkommen in der ESPAS</h1>
            <div class="name">Brian Weiss</div>
            <div class="subtitle">
                Schön, dass du heute als Schnupperer bei uns bist.
            </div>
        </div>

    </div>

    <!-- SVG FILTER FÜR LIQUID GLASS EFFEKT -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
        <defs>
            <filter id="apple-heavy-distortion">
                <feTurbulence type="fractalNoise" baseFrequency="0.007" numOctaves="1" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

</body>

</html>
